<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le mot de passe - Authentification Sécurisée</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Modifier le mot de passe</h1>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <!-- ASVS 6.2.2: Demander le mot de passe actuel -->
            <!-- ASVS 6.2.3: Appliquer les mêmes règles que pour l'inscription -->
            <form method="POST" action="{{ url_for('change_password') }}">
                <div class="form-group">
                    <label for="current_password">Mot de passe actuel</label>
                    <input 
                        type="password" 
                        id="current_password" 
                        name="current_password" 
                        required 
                        autofocus
                        autocomplete="current-password">
                </div>
                
                <div class="form-group">
                    <label for="new_password">Nouveau mot de passe</label>
                    <input 
                        type="password" 
                        id="new_password" 
                        name="new_password" 
                        required
                        minlength="8"
                        autocomplete="new-password">
                    <small class="form-text">Minimum 8 caractères. Évitez les mots de passe courants.</small>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Confirmer le nouveau mot de passe</label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        required
                        minlength="8"
                        autocomplete="new-password">
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Modifier</button>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
